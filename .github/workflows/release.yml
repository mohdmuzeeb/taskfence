name: Release

# Publishing a GitHub release tagged vX.Y.Z uploads that version to PyPI.
# "Run workflow" (manual) uploads to TestPyPI instead, as a dry run.
# Both use PyPI trusted publishing (OIDC): no API token is stored in this repository.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        if: github.event_name == 'release'
        run: |
          pkg=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          mod=$(PYTHONPATH=src python -c 'import taskfence; print(taskfence.__version__)')
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag pyproject=$pkg __version__=$mod"
          test "$tag" = "$pkg" && test "$pkg" = "$mod"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python "$GITHUB_WORKSPACE/examples/01_quickstart_sqlite.py" | tee out.txt
          grep -q "refund blocked: STALE_EPOCH" out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/taskfence/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/taskfence/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
